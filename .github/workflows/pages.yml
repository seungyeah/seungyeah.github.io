name: Deploy LayAll Blog
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ['content/posts/**', 'content/folders/**', '.layall/**', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: node .layall/build.mjs "$RUNNER_TEMP/layall-site" "${{ github.sha }}"
      - uses: actions/upload-pages-artifact@v3
        with: { path: '${{ runner.temp }}/layall-site' }
  deploy:
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
