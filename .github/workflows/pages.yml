name: Deploy LayAll Blog
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ['content/posts/**', 'content/folders/**', '.layall/**', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: node .layall/build.mjs "$RUNNER_TEMP/layall-site" "${{ github.sha }}"
      - uses: actions/upload-pages-artifact@v3
        with: { path: '${{ runner.temp }}/layall-site' }
  deploy:
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Verify LayAll publishing source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`${process.env.GH_API_URL}/repos/${process.env.GH_REPOSITORY}/pages`, {
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2026-03-10'
            }
          });
          if (!response.ok || (await response.json()).build_type !== 'workflow') {
            throw new Error('LayAll requires GitHub Actions publishing. Reconnect the blog in LayAll before deploying.');
          }
          NODE
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
